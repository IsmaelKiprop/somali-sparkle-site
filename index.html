    <!-- Immediate scroll-to-top prevention - runs before anything else -->
    <script>
      // Prevent any scroll restoration immediately
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      
      // Force scroll to top immediately
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      window.pageYOffset = 0;
      
      // Override any scroll attempts
      var originalScrollTo = window.scrollTo;
      window.scrollTo = function(x, y) {
        if (arguments.length === 1 && typeof x === 'object') {
          originalScrollTo.call(window, 0, 0);
        } else {
          originalScrollTo.call(window, 0, 0);
        }
      };
      
      // Restore normal scrolling after page loads
      setTimeout(function() {
        window.scrollTo = originalScrollTo;
        window.scrollTo(0, 0);
      }, 1500);
    </script>
